<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#03407f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kerja Ray">
<title>Aplikasi Kerja Ray</title>
<style>
:root{
  --bg:#f3f4fb;--bg2:#e9ebf8;--surface:#ffffff;--surface2:#f7f8fd;--glass:rgba(255,255,255,.72);
  --tx:#141827;--mut:#6a7089;--line:rgba(20,24,39,.09);--shadow:0 1px 2px rgba(20,24,39,.05),0 10px 30px -12px rgba(60,64,140,.22);
  --acc:#5b5bf0;--acc2:#8b5cf6;--accsoft:rgba(91,91,240,.12);
  --ok:#0f9d6b;--oksoft:rgba(15,157,107,.13);--er:#e5484d;--ersoft:rgba(229,72,77,.12);--wa:#d98a06;--wasoft:rgba(217,138,6,.14);
  --r:18px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#080b14;--bg2:#0d1222;--surface:#121829;--surface2:#171e33;--glass:rgba(18,24,41,.74);
  --tx:#eef0fa;--mut:#8f97b5;--line:rgba(255,255,255,.08);--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.65);
  --acc:#7c7cff;--acc2:#a78bfa;--accsoft:rgba(124,124,255,.16);
  --ok:#3ddc97;--oksoft:rgba(61,220,151,.14);--er:#ff7a80;--ersoft:rgba(255,122,128,.14);--wa:#ffc15a;--wasoft:rgba(255,193,90,.14)}}
:root[data-theme=dark]{
  --bg:#080b14;--bg2:#0d1222;--surface:#121829;--surface2:#171e33;--glass:rgba(18,24,41,.74);
  --tx:#eef0fa;--mut:#8f97b5;--line:rgba(255,255,255,.08);--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.65);
  --acc:#7c7cff;--acc2:#a78bfa;--accsoft:rgba(124,124,255,.16);
  --ok:#3ddc97;--oksoft:rgba(61,220,151,.14);--er:#ff7a80;--ersoft:rgba(255,122,128,.14);--wa:#ffc15a;--wasoft:rgba(255,193,90,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body{margin:0;color:var(--tx);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 500px at 8% -10%,var(--accsoft),transparent 60%),radial-gradient(700px 480px at 100% 0,rgba(139,92,246,.10),transparent 55%),var(--bg);
  background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
svg{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
main{padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));max-width:1080px;width:100%;margin:0 auto}
.pasangBtn[hidden]{display:none!important}
.akunbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.akunbar span{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.akunbar .btn{padding:7px 14px;flex:none}
@media(min-width:900px){
  .akunbar{display:none}
  .shell{grid-template-columns:240px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;padding:22px 16px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px)}
  main{padding:26px 32px 48px}
  .tabbar{display:none!important}
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;font-weight:700;letter-spacing:-.01em}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px -6px var(--acc)}
.logo svg{width:20px;height:20px;stroke-width:2.2}
#menuback{display:none}.brand .logotile,.mlogo{cursor:pointer;-webkit-tap-highlight-color:transparent}.mlogo{display:inline-grid;vertical-align:middle;margin-right:8px;padding:3px 6px;border-radius:10px}.mlogo img{height:20px;width:auto;display:block}
@media(max-width:899px){.tabbar{display:none!important}main{padding-bottom:28px}body.menuopen .side{display:flex!important;flex-direction:column;gap:6px;position:fixed!important;left:0;top:0;bottom:0;width:260px;max-width:82vw;height:100vh;height:100dvh;z-index:60;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(18px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom));background:var(--surface);box-shadow:0 0 60px rgba(0,0,0,.55)}#menuback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}body.menuopen #menuback{display:block}body.menuopen{overflow:hidden}body.menuopen .side .sidefoot{margin-top:auto;padding-top:14px}}
@media(min-width:900px){body.menuoff #sidenav{display:none}body.menuoff .shell{grid-template-columns:92px 1fr}body.menuoff .side .brand>div:not(.logotile),body.menuoff .sidefoot{display:none}body.menuoff .side .brand{justify-content:center;padding-left:0;padding-right:0}}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:11.5px;margin-top:-2px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;cursor:pointer;text-align:left;width:100%;transition:.15s}
.nav:hover{background:var(--accsoft);color:var(--tx)}
.nav.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 8px 18px -8px var(--acc)}
.nav .cnt{margin-left:auto;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--er);color:#fff}
.sidefoot{margin-top:auto;display:grid;gap:8px}

.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow);z-index:20}
.tabbar button{flex:1;display:grid;justify-items:center;gap:2px;padding:7px 2px;border:0;background:none;color:var(--mut);font:inherit;font-size:10.5px;font-weight:600;border-radius:16px;cursor:pointer;position:relative}
.tabbar button svg{width:21px;height:21px}
.tabbar button.on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.tabbar .dotc{position:absolute;top:3px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:9px;background:var(--er);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

/* ---------- komponen ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{margin:0;font-size:24px;letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;background:var(--accsoft);color:var(--acc);white-space:nowrap}
.pill.ok{background:var(--oksoft);color:var(--ok)}.pill.er{background:var(--ersoft);color:var(--er)}.pill.wa{background:var(--wasoft);color:var(--wa)}.pill.mut{background:var(--surface2);color:var(--mut)}
.live{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2s infinite}
.pill.er .live,.pill.mut .live{animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#c026d3 120%);box-shadow:0 22px 44px -22px #6d28d9;margin-bottom:14px}
.hero.bad{background:linear-gradient(135deg,#be123c,#e11d48 55%,#f97316 130%);box-shadow:0 22px 44px -22px #e11d48}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h2{margin:0;font-size:22px;letter-spacing:-.02em;position:relative}.hero p{margin:6px 0 0;opacity:.88;font-size:14px;position:relative;max-width:46ch}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 16px}.stat .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px;background:var(--accsoft);color:var(--acc)}
.stat.ok .ic{background:var(--oksoft);color:var(--ok)}.stat.er .ic{background:var(--ersoft);color:var(--er)}.stat.wa .ic{background:var(--wasoft);color:var(--wa)}
.stat b{font-size:28px;line-height:1;letter-spacing:-.03em;display:block}.stat span{color:var(--mut);font-size:12.5px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}.sec h3{margin:0;font-size:15px}
.grid{display:grid;gap:12px}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}
.item{display:grid;gap:10px}
.item .h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.nm{font-weight:650;letter-spacing:-.01em;word-break:break-word}.mut{color:var(--mut);font-size:12.5px;word-break:break-word}
.err{background:var(--ersoft);color:var(--er);border-radius:12px;padding:10px 12px;font-size:13px;word-break:break-word}
.err b{display:inline-flex;align-items:center;gap:5px;margin-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface2);color:var(--tx);padding:9px 15px;border-radius:12px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}
.btn.pri{border:0;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 20px -10px var(--acc)}
.btn.ok{border:0;color:#fff;background:linear-gradient(135deg,#0f9d6b,#16c784)}.btn.dg{color:var(--er);background:var(--ersoft);border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.full{width:100%;padding:13px}
.sw{position:relative;width:46px;height:28px;border-radius:99px;border:0;background:var(--line);cursor:pointer;transition:.2s;flex:none;padding:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:linear-gradient(135deg,#0f9d6b,#16c784)}.sw.on:after{left:21px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--mut);padding:7px 14px;border-radius:99px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:transparent}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;color:var(--mut);padding:10px;border-radius:11px;font:inherit;font-weight:650;cursor:pointer;display:flex;gap:7px;align-items:center;justify-content:center}
.seg button.on{background:var(--surface);color:var(--tx);box-shadow:var(--shadow)}
label{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:var(--mut)}
input,textarea,select{font:inherit;font-size:15px;color:var(--tx);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--accsoft)}
select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%277%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 fill=%27none%27 stroke=%27%238a93a6%27 stroke-width=%272%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;text-overflow:ellipsis}
.form{display:grid;gap:13px}.two-in{display:grid;gap:13px}@media(min-width:620px){.two-in{grid-template-columns:1fr 1fr}}
.empty{text-align:center;color:var(--mut);padding:38px 10px}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:8px}
.bars{display:flex;align-items:flex-end;gap:3px;height:74px}
.bars i{flex:1;border-radius:4px 4px 2px 2px;min-height:3px;background:linear-gradient(180deg,var(--acc),var(--acc2));opacity:.85}
.bars i.e{background:var(--er)}
.legend{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:6px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;background:var(--wasoft);color:var(--wa);font-size:13.5px;margin-bottom:14px}
.banner svg{margin-top:2px}
.step{display:flex;gap:12px;align-items:center}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;font-weight:700;flex:none}
.sk{border-radius:var(--r);height:96px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}
.fade{animation:in .28s ease both}.still .fade,.still.fade{animation:none}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);z-index:60;max-width:calc(100vw - 32px);animation:in .25s both}
@media(min-width:900px){.toast{bottom:28px}}
.modal{position:fixed;inset:0;background:rgba(5,8,18,.55);backdrop-filter:blur(6px);display:grid;align-items:end;justify-items:center;z-index:50;animation:fadein .2s both}
@keyframes fadein{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1) both}
@media(min-width:620px){.modal{align-items:center}.sheet{border-radius:26px;padding-bottom:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet.big{max-width:560px;max-height:88vh;overflow:auto}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13.5px;margin:0 0 14px}.kv>span:nth-child(odd){color:var(--mut)}.kv b{word-break:break-word}
.path{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.path i{font-style:normal;font-size:12px;padding:4px 9px;border-radius:99px;background:var(--surface2);color:var(--mut)}.path i.bad{background:var(--ersoft);color:var(--er);font-weight:700}
.code{background:var(--surface2);border-radius:12px;padding:10px 12px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;margin:0 0 14px;max-height:140px;overflow:auto}
.sheet h5{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.click{cursor:pointer}.click:active{transform:scale(.99)}
.who{font-size:12.5px;color:var(--mut);margin-top:2px}.who b{color:var(--tx)}
.sheet h4{margin:0 0 6px;font-size:18px;letter-spacing:-.01em}.sheet p{margin:0 0 18px;color:var(--mut)}.sheet .row{justify-content:flex-end}

/* ---------- login ---------- */
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}
.lgc{width:100%;max-width:380px;text-align:center}
.lgc .logo{width:62px;height:62px;border-radius:20px;margin:0 auto 18px}.lgc .logo svg{width:30px;height:30px}
.lgc h1{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}.lgc p{margin:0 0 22px;color:var(--mut)}
.lgc .card{display:grid;gap:12px;text-align:left;padding:20px}
.chatwrap{display:flex;flex-direction:column;min-height:calc(100vh - 150px)}
.msgs{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:12px}
.msg{display:flex;gap:9px;max-width:92%}.msg.me{align-self:flex-end;flex-direction:column;align-items:flex-end}
.msg .av{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;flex:none}
.msg .av svg{width:16px;height:16px}.msg .col{min-width:0}
.bub{padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.5;word-break:break-word;background:var(--surface);border:1px solid var(--line);border-top-left-radius:6px;box-shadow:var(--shadow)}
.msg.me .bub{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:18px;border-top-right-radius:6px}
.bub.file{display:flex;gap:10px;align-items:center;border-color:var(--ok)}.fic{width:36px;height:36px;border-radius:11px;background:var(--oksoft);color:var(--ok);display:grid;place-items:center;flex:none}
.ts{font-size:11px;color:var(--mut);margin:3px 4px 0}
.typing{display:flex;gap:5px;padding:14px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bn 1.2s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.composer{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 22%);padding-top:14px;z-index:5}
@media(min-width:900px){.composer{bottom:0}}
.composer .chips{margin:0 0 8px}.chip.ok{background:var(--ok);color:#fff;border-color:transparent}.chip.dg{background:var(--er);color:#fff;border-color:transparent}
.cin{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
.cin textarea{border:0;background:none;resize:none;padding:9px 0;max-height:140px;box-shadow:none!important;border-radius:0}
.cin textarea:focus{box-shadow:none}
.send{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.send svg{width:19px;height:19px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bbdrop{margin-top:10px;border:1.5px dashed var(--line);border-radius:14px;padding:20px 12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.bbdrop:hover,.bbdrop.on{border-color:var(--acc);background:var(--accsoft)}
.bbdrop svg{width:26px;height:26px;color:var(--acc)}
.bbdrop small{color:var(--mut)}
.bbtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bbtools select,.bbtools input{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit;min-width:0}
.bbtools input{flex:1 1 160px}
.tbw{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.tbl{border-collapse:collapse;width:max-content;min-width:100%;font-size:12.5px}
.tbl th,.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.tbl th{position:sticky;top:0;background:var(--surface);font-weight:600;z-index:1}
.tbl tr.tot td{font-weight:700;background:var(--accsoft)}
.pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.pager .mut{flex:1 1 auto}
.vrbar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:10px 0 6px}.vrbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}

.tabsel{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tabsel .btn.on{background:var(--acc);color:#fff}

const isBad = (e) => e.status === "error" || e.status === "crashed";
const TRANSIENT = /too many requests|rate limit|quota exceeded|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|socket hang up|timed out|ECONNREFUSED|503|502|429/i;
function resolvedBy(e) {
  const ex = S.executions;
  if (ex.some((x) => String(x.retry_of) === String(e.id) && x.status === "success")) return "dicoba ulang, berhasil";
  const t = new Date(e.started), later = (x) => x.wf_id === e.wf_id && new Date(x.started) > t;
  if (TRANSIENT.test(e.err_msg || "")) {
    if (ex.some((x) => later(x) && x.status === "success")) return "pulih otomatis";
    if (S.now - t > 3e5 && !ex.some((x) => later(x) && isBad(x))) return "pulih otomatis, tidak berulang";
  }
  // percobaan ulang yang gagal/rusak, padahal eksekusi asalnya sudah berhasil diulang
  if (e.retry_of && ex.some((x) => String(x.retry_of) === String(e.retry_of) && x.status === "success" && new Date(x.started) > t)) return "sudah diperbaiki lewat percobaan ulang berikutnya";
  // workflow sudah diperbaiki (diubah) setelah eror ini, dan eksekusi sesudahnya berhasil
  const wf = (S.workflows || []).find((w) => w.id === e.wf_id);
  if (wf && wf.updated && new Date(wf.updated) > t && ex.some((x) => later(x) && new Date(x.started) > new Date(wf.updated) && x.status === "success")) return "sudah diperbaiki, berjalan normal lagi";
  // eror dari pemicu terjadwal/hasil ulang: kalau eksekusi berikutnya sukses, berarti sudah normal
  if (/^(trigger|cron|retry|manual)$/.test(e.mode) && ex.some((x) => later(x) && x.status === "success")) return "workflow sudah berjalan normal lagi";
  // eror apa pun (termasuk lewat webhook): sudah lewat 5 menit, sesudahnya ada yang sukses dan tidak ada eror lagi -> sudah normal
  if (S.now - t > 3e5 && ex.some((x) => later(x) && x.status === "success") && !ex.some((x) => later(x) && isBad(x))) return "pulih otomatis, berjalan normal lagi";
  return "";
}
const infoOf = (e) => { try { return e.info ? JSON.parse(e.info) : null; } catch (x) { return null; } };

  if (i && i.who) return i.who.web ? "Pengguna: <b>Website kontrol</b>" : "Pengguna: <b>" + esc(i.who.name || "Tanpa nama") + "</b> • " + esc(fmtNum(i.who.number));
  if (e.mode === "trigger" || e.mode === "cron") return "Pemicu: <b>terjadwal otomatis</b> (bukan dari pengguna)";

}

function jenisPesan(items) {
  let cur = "";
  return items.map((o) => {
    const t = String(o.text || "") + " " + String(o.filename || "") + " " + String(o.caption || "");
    let j = "";
    if (o.kind === "file") j = /invoice|kwitansi/i.test(t) ? "inv" : /slip/i.test(t) ? "slip" : "";
    else if (/^\s*(Minta slip gaji|Nama:)/i.test(o.text || "")) j = "slip";
    else if (/^\s*(Buat invoice|Lokasi:)/i.test(o.text || "")) j = "inv";
    else if (/No\. ?Invoice|No\. ?Kwitansi|Tanggal Pengiriman|Bagian Kerja|Invoice & Kwitansi|Terbilang/i.test(t)) j = "inv";
    else if (/slip gaji|SLIP GAJI|slip/i.test(t)) j = "slip";
    if (j) cur = j;
    return j || cur;
  });
}

}

function pgBacaBerkas(f) {

    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return no(new Error(f.name + ": hanya foto JPG/PNG/WebP atau PDF"));

      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);

    };

    im.src = u;
  });
}

      if (r.error) { toast(r.error); b.disabled = false; b.textContent = ubah ? "Ajukan ulang" : "Kirim pengajuan"; return; }
      tutup(); toast(ubah ? "Diajukan ulang ke HRD" : "Pengajuan terkirim ke HRD"); pgMuat();
    } catch (e) { if (e.message !== "login") toast(e.message || "Gagal mengirim"); b.disabled = false; b.textContent = ubah ? "Ajukan ulang" : "Kirim pengajuan"; }
  };
}
window.pgBukaFile = async (id, nama) => {
  try {
    const f = await api("/api/pj/file?id=" + id); if (f.error) return toast(f.error);
    const bin = atob(f.data), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], { type: f.mime }));
    if (/^image\//.test(f.mime)) { const box = $("#pg_prev"); if (box) box.innerHTML = '<img src="' + url + '" alt="' + esc(nama) + '" style="max-width:100%;border-radius:12px;margin-top:8px">'; }
    else { const a = document.createElement("a"); a.href = url; a.download = f.nama || nama || "lampiran.pdf"; document.body.appendChild(a); a.click(); a.remove(); }
  } catch (e) { if (e.message !== "login") toast("Gagal membuka berkas"); }
};
window.pgDetail = async (id) => {
  let x; try { x = await api("/api/pj/detail?id=" + id); } catch (e) { return; }
  if (x.error) return toast(x.error);
  const peran = PGME && PGME.peran, giliran = x.giliran;
  const tl = x.log.map((l) => { const [t, k] = PG_AKSI[l.aksi] || [l.aksi, "mut"]; return '<div class="t"><i class="' + k + '"></i><div><b>' + esc(t) + "</b> · " + esc(l.nama || l.email) + ' <span class="mut">(' + esc(PGN[l.peran] || l.peran) + ')</span><div class="mut" style="font-size:12.5px">' + pgWaktu(l.ts) + "</div>" + (l.memo ? '<div style="font-size:13.5px">' + esc(l.memo) + "</div>" : "") + "</div></div>"; }).join("");
  const lamp = (x.files || []).map((f) => '<button class="btn" onclick="pgBukaFile(' + f.id + ',\'' + esc(f.nama).replace(/'/g, "") + '\')">' + ic("doc") + (f.jenis === "bukti_bayar" ? "Bukti transfer: " : "") + esc(f.nama) + "</button>" + (String(f.drive_link || "").startsWith("https://drive.google.com/") ? '<a class="btn" href="' + esc(f.drive_link) + '" target="_blank" rel="noopener">Buka di Drive</a>' : "")).join("");
  let aksi = "";
  if (giliran && TAHAP_PG.includes(peran) && peran !== "bendahara") {
    aksi = '<div class="form" style="margin-top:12px"><label>Catatan (wajib bila menolak atau meminta revisi)<textarea id="pa_memo" rows="2" maxlength="600"></textarea></label></div><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn pri" onclick="pgAksi(' + x.id + ',\'setuju\')">Setujui & lanjutkan</button><button class="btn" onclick="pgAksi(' + x.id + ',\'revisi\')">Minta revisi</button><button class="btn dg" onclick="pgAksi(' + x.id + ',\'tolak\')">Tolak</button></div>';
  } else if (giliran && peran === "bendahara") {
    aksi = '<div class="form" style="margin-top:12px"><div class="mut" style="font-size:12.5px;font-weight:600">Pembayaran</div><div class="two-in"><label>Tanggal bayar<input id="pa_tgl" type="date" value="' + pgHariIni() + '"></label><label>No. referensi transfer<input id="pa_ref" maxlength="60"></label></div>' +
      '<label>Catatan<textarea id="pa_memo" rows="2" maxlength="600" placeholder="Wajib diisi bila menolak atau meminta revisi"></textarea></label><label>Bukti transfer (opsional, foto atau PDF)<input id="pa_file" type="file" accept="image/*,application/pdf"></label></div>' +
      '<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn pri" id="pa_bayar" onclick="pgBayar(' + x.id + ')">Tandai sudah dibayar</button><button class="btn" onclick="pgAksi(' + x.id + ',\'revisi\')">Minta revisi</button><button class="btn dg" onclick="pgAksi(' + x.id + ',\'tolak\')">Tolak</button></div>';
  } else if (peran === "korlap") {
    if (x.status === "revisi") aksi += '<div class="row" style="margin-top:12px"><button class="btn pri" onclick="pgUbah(' + x.id + ')">Ubah & ajukan ulang</button><button class="btn dg" onclick="pgBatal(' + x.id + ')">Batalkan pengajuan</button></div>';
    else if (["hrd", "dirops", "dirut"].includes(x.status)) aksi += '<div class="row" style="margin-top:12px"><button class="btn dg" onclick="pgBatal(' + x.id + ')">Batalkan pengajuan</button></div>';
  }
  window._pgX = x;
  const tutup = pgModal('<h4>' + esc(x.judul) + '</h4><p>' + esc(x.kode) + " · " + pgPill(x.status) + " · <b>" + rp(x.nominal) + "</b></p>" +
    '<div class="form" style="gap:6px;margin:6px 0 10px"><div><b>' + esc(x.nama_pemohon) + '</b> · ' + esc(x.lokasi) + '</div><div class="mut">' + esc(x.kategori) + " · dibutuhkan " + pgTgl(x.tgl_butuh) + (x.putaran > 1 ? " · diajukan ulang " + (x.putaran - 1) + "×" : "") + "</div><div>" + esc(x.uraian) + "</div>" +
    '<div class="mut">Rekening tujuan: ' + esc(x.bank) + " · " + esc(x.norek) + " a.n. " + esc(x.atas_nama) + "</div>" +
    (x.status === "dibayar" ? '<div class="mut">Dibayar ' + pgTgl(x.bayar_tgl) + (x.bayar_ref ? " · Ref " + esc(x.bayar_ref) : "") + (x.bayar_oleh ? " · oleh " + esc(x.bayar_oleh) : "") + "</div>" : "") + "</div>" +
    (lamp ? '<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:6px">' + lamp + '</div><div id="pg_prev"></div>' : "") +
    '<div class="agtl" style="margin-top:10px">' + tl + "</div>" + aksi + '<div class="row" style="margin-top:12px"><button class="btn" id="mn">Tutup</button></div>');
  $("#mn").onclick = tutup;
};
const TAHAP_PG = ["hrd", "dirops", "dirut", "bendahara"];
window.pgAksi = async (id, aksi) => {
  const memo = ($("#pa_memo") || {}).value || "";
  if ((aksi === "tolak" || aksi === "revisi") && !memo.trim()) return toast(aksi === "tolak" ? "Tulis alasan penolakan" : "Tulis bagian yang harus direvisi");
  const kata = { setuju: "Setujui pengajuan ini dan teruskan ke tahap berikutnya?", tolak: "Tolak pengajuan ini? Korlap harus membuat pengajuan baru.", revisi: "Kembalikan ke Korlap untuk direvisi?" }[aksi];
  ask(aksi === "setuju" ? "Setujui pengajuan?" : aksi === "tolak" ? "Tolak pengajuan?" : "Minta revisi?", kata, aksi === "setuju" ? "Setujui" : aksi === "tolak" ? "Tolak" : "Minta revisi", aksi === "tolak", async () => {
    try { const r = await api("/api/pj/aksi", { id, aksi, memo }); if (r.error) { toast(r.error); pgMuat(); return; } $("#layer").innerHTML = ""; toast(aksi === "setuju" ? "Disetujui, diteruskan ke tahap berikutnya" : aksi === "tolak" ? "Pengajuan ditolak" : "Dikembalikan ke Korlap untuk revisi"); pgMuat(); }
    catch (e) { if (e.message !== "login") toast("Gagal menyimpan keputusan"); }
  });
};
window.pgBayar = async (id) => {
  const b = $("#pa_bayar"); b.disabled = true;
  try {
    const f = $("#pa_file").files[0], bukti = f ? await pgBacaBerkas(f) : null;
    const r = await api("/api/pj/aksi", { id, aksi: "bayar", tgl: $("#pa_tgl").value, ref: $("#pa_ref").value, memo: $("#pa_memo").value, bukti });
    if (r.error) { toast(r.error); b.disabled = false; return; }
    $("#layer").innerHTML = ""; toast(r.peringatan || "Pembayaran tercatat"); pgMuat();
  } catch (e) { if (e.message !== "login") toast(e.message || "Gagal mencatat pembayaran"); b.disabled = false; }
};
window.pgUbah = (id) => { const x = window._pgX; if (x && x.id === id) pgForm(x); };
window.pgBatal = (id) => ask("Batalkan pengajuan?", "Pengajuan dibatalkan dan tidak diproses lagi.", "Batalkan", true, async () => {
  try { const r = await api("/api/pj/batal", { id }); if (r.error) { toast(r.error); pgMuat(); return; } $("#layer").innerHTML = ""; toast("Pengajuan dibatalkan"); pgMuat(); } catch (e) { if (e.message !== "login") toast("Gagal membatalkan"); }
});
