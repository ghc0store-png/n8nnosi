<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070a16">
<title>Laporan Harian Internal — PT Ray Mitra Perkasa</title>
<link rel="icon" href="../favicon-64.png">
<style>
/* RAY Workspace — gaya tampilan v6 (modern, jelas, ramah HP) */
:root{
  --bg:#070a16;--bg2:#0b1022;--panel:#0f1530;--panel2:#151c3d;--line:#212c58;--ink:#f2f5ff;--mut:#93a0c9;
  --a1:#7c6cff;--a2:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--info:#38bdf8;
  --glow:#7c6cff40;--glass:rgba(17,24,52,.72);--shadow:0 12px 40px #00000066;--r:18px;
  --ff:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
[data-theme=light]{
  --ok:#0f9d6a;--warn:#b7791f;--bad:#d6334d;--info:#0b78b8;--a2:#0891b2;
  --bg:#f3f5fb;--bg2:#ffffff;--panel:#ffffff;--panel2:#eef1fa;--line:#dfe5f4;--ink:#121933;--mut:#5f6a93;
  --glow:#7c6cff26;--glass:rgba(255,255,255,.9);--shadow:0 8px 28px #1b2a6a14;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font:15px/1.5 var(--ff);background:var(--bg);color:var(--ink);min-height:100vh;font-variant-numeric:tabular-nums;
  background-image:radial-gradient(900px 520px at 88% -12%,#7c6cff26,transparent),radial-gradient(760px 520px at -8% 108%,#22d3ee14,transparent);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;transition:.15s;min-width:0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--a1);box-shadow:0 0 0 3px var(--glow)}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
textarea{resize:vertical;min-height:44px}input[type=checkbox]{width:auto}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}

/* ---- kerangka ---- */
.side{position:fixed;inset:0 auto 0 0;width:256px;overflow-y:auto;overscroll-behavior:contain;background:var(--bg2);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;z-index:10}
#menuback{display:none}.side .logo,.mlg{cursor:pointer;-webkit-tap-highlight-color:transparent}.mlg{display:none;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--a1),var(--a2));place-items:center;font-weight:800;font-size:13px;color:#fff;border:0;flex:none}
@media(min-width:901px){body.menuoff .side{width:76px;align-items:center;padding-left:8px;padding-right:8px}body.menuoff .side .logo{padding:4px 0 20px}body.menuoff .side .logo>div,body.menuoff .side .nv span,body.menuoff .side .me>div,body.menuoff .side .me .ib{display:none}body.menuoff .side .nv{justify-content:center;padding:11px 0}body.menuoff .wrap{margin-left:76px}}
@media(max-width:900px){.mlg{display:grid}}
.logo{display:flex;gap:11px;align-items:center;padding:4px 8px 20px}
.logo i{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;box-shadow:0 6px 20px var(--glow)}
.logo b{display:block;letter-spacing:.2px;font-size:15px}.logo small{color:var(--mut);font-size:11.5px}
.nv{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;color:var(--mut);text-align:left;width:100%;transition:.15s;position:relative;font-weight:500}
.nv:hover{background:var(--panel2);color:var(--ink)}
.nv.on{background:linear-gradient(90deg,#7c6cff33,transparent);color:var(--ink);font-weight:600}
.nv.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--a1),var(--a2))}
.nv .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700;min-width:20px;text-align:center}
.nv .cnt.g{background:var(--ok);color:#04251a}
.sp{flex:1}
.me{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.me small{color:var(--mut);display:block;font-size:11.5px;line-height:1.3}
.av{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--a1),#ec4899);display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.wrap{margin-left:256px;min-height:100vh;min-width:0}
.top{position:sticky;top:0;z-index:9;display:flex;gap:12px;align-items:center;padding:14px 32px;background:linear-gradient(var(--bg) 60%,transparent);backdrop-filter:blur(8px)}
.top .hi{font-size:13px;color:var(--mut)}.top .hi b{color:var(--ink)}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;color:var(--mut);flex:none}
.ib:hover{color:var(--ink);border-color:var(--a1)}
.statpill{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;color:var(--mut);background:var(--glass)}
.statpill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.statpill.demo i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
main{padding:0 32px 110px;max-width:1260px;min-width:0;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---- teks & kartu ---- */
h1{font-size:28px;letter-spacing:-.6px;line-height:1.2}h2{font-size:17px;margin-bottom:12px;letter-spacing:-.2px}
.sub{color:var(--mut)}
.ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin:6px 0 20px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(10px);box-shadow:var(--shadow);margin-bottom:18px;min-width:0}
.g{display:grid;gap:18px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}.g3{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g4{grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr))}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;padding:10px 18px;border-radius:12px;font-weight:600;background:linear-gradient(135deg,var(--a1),#8b5cf6);color:#fff;box-shadow:0 6px 18px var(--glow);transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.ok{background:linear-gradient(135deg,#10b981,#34d399);color:#04251a}
.btn.red{background:linear-gradient(135deg,#e11d48,#fb7185)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}.btn.lg{padding:13px 22px;font-size:15.5px;border-radius:14px}
.pill{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.sent,.pill.selesai,.pill.lunas,.pill.ok,.pill.dibayar{background:#34d39922;color:var(--ok);border-color:#34d39944}
.pill.draft,.pill.proses,.pill.dibuat,.pill.warn{background:#fbbf2420;color:var(--warn);border-color:#fbbf2444}
.pill.none,.pill.belum,.pill.bad{background:#fb718522;color:var(--bad);border-color:#fb718544}
.pill.terkirim,.pill.info,.pill.ditagih{background:#38bdf822;color:var(--info);border-color:#38bdf844}
.pill.mut,.pill.nihil{background:var(--panel2);color:var(--mut)}
.prog{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden}.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .6s}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.tools>*{width:auto}.tools input{min-width:200px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;max-width:100%;overflow-x:auto}
.seg button{padding:7px 14px;border-radius:9px;color:var(--mut);font-size:13px;font-weight:600;white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--a1),#8b5cf6);color:#fff}
.seg button.on.s-belum{background:var(--bad)}.seg button.on.s-proses{background:var(--warn);color:#2b1d00}.seg button.on.s-selesai{background:var(--ok);color:#04251a}

/* ---- kotak angka (tile) ---- */
.stat{padding:16px 18px;border-radius:18px;background:var(--glass);border:1px solid var(--line);position:relative;overflow:hidden;min-width:0;text-align:left;transition:.15s}
.stat::after{content:"";position:absolute;right:-34px;top:-34px;width:110px;height:110px;border-radius:50%;background:var(--c,var(--a1));opacity:.13;filter:blur(8px)}
.stat small{color:var(--mut);display:flex;gap:8px;align-items:center;font-weight:600;font-size:12.5px}
.stat b{display:block;font-size:28px;letter-spacing:-1px;margin-top:6px;line-height:1.1}
.stat em{font-style:normal;font-size:12.5px;color:var(--mut);display:block;margin-top:4px}
.stat .ti{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--a1)) 20%,transparent);color:var(--c,var(--a1))}
.stat .ti svg{width:16px;height:16px}
button.stat{cursor:pointer;width:100%}button.stat:hover{transform:translateY(-2px);border-color:var(--c,var(--a1))}
button.stat.on{border-color:var(--c,var(--a1));box-shadow:0 0 0 1px var(--c,var(--a1)),0 10px 30px color-mix(in srgb,var(--c,var(--a1)) 25%,transparent)}
.hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#7c6cff30,#22d3ee14),var(--glass)}

/* ---- panduan singkat ---- */
.guide{background:linear-gradient(135deg,#7c6cff22,#22d3ee10),var(--glass);border:1px solid #7c6cff55;border-radius:18px;padding:14px 16px;margin-bottom:18px;position:relative}
.guide>b{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:10px}
.guide ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;list-style:none;padding:0}
.guide li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink);line-height:1.4}
.guide li i{flex:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-size:12px;font-weight:700;font-style:normal;color:#fff}
.guide .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;color:var(--mut);display:grid;place-items:center}.guide .x:hover{background:var(--panel2);color:var(--ink)}

/* ---- tab berhitung ---- */
.tabs2{display:flex;gap:8px;flex-wrap:wrap}
.tabs2 button{display:inline-flex;gap:8px;align-items:center;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-weight:600;font-size:13.5px;transition:.15s}
.tabs2 button:hover{color:var(--ink);border-color:var(--a1)}
.tabs2 button.on{background:linear-gradient(135deg,var(--a1),#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 6px 18px var(--glow)}
.tabs2 button b{font-size:11.5px;background:#ffffff22;border-radius:99px;padding:0 8px;line-height:19px}
.tabs2 button:not(.on) b{background:var(--line);color:var(--ink)}

/* ---- kartu client + langkah ---- */
.cl2{--c:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px 14px 20px;margin-bottom:12px;transition:.15s;position:relative;box-shadow:inset 5px 0 0 var(--c)}
.cl2[data-cat=belum]{--c:var(--bad)}.cl2[data-cat=ditagih]{--c:var(--info)}.cl2[data-cat=dibayar]{--c:var(--ok)}
.cl2:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line));transform:translateY(-1px)}
.cl2 .nm{font-size:16px;font-weight:650;letter-spacing:-.2px;cursor:pointer;line-height:1.3}.cl2 .nm:hover{color:var(--a2)}
.cl2 .amt{font-size:18px;font-weight:700;letter-spacing:-.4px}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 12px}
.stp{display:inline-flex;gap:8px;align-items:center;padding:8px 14px 8px 9px;border-radius:99px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13.5px;font-weight:550;transition:.15s;text-align:left}
.stp i{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:transparent;transition:.15s;flex:none}
.stp:hover{border-color:var(--ok)}.stp:hover i{border-color:var(--ok)}
.stp.on{background:#34d3991c;border-color:#34d39966;color:var(--ok)}.stp.on i{background:var(--ok);border-color:var(--ok);color:#04251a}
.stp.next{border-color:var(--a2);box-shadow:0 0 0 3px #22d3ee22}
.stp.add{border-style:dashed;color:var(--mut);padding-left:12px}
.cl2 .foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.hint{font-size:13px;color:var(--mut)}.hint b{color:var(--ink)}.hint .nx{color:var(--a2);font-weight:650}.hint .dg{color:var(--bad)}
.rowdone{--c:var(--ok)}

/* ---- tabel ---- */
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:12px;color:var(--mut);text-align:left;font-weight:650;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:hover td{background:#7c6cff0d}.tbl tr:last-child td{border:0}
.tbl td small{display:block;color:var(--mut);font-size:11.5px}
.tbl.rowdone td{background:transparent}tr.rowdone td{background:#34d3990d}tr.rowdone b{color:var(--ok)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl .stick{position:sticky;left:0;background:var(--panel);z-index:1;min-width:210px}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff;flex:none;transition:.2s;background:var(--panel2)}
.chk:hover{border-color:var(--ok)}.chk.on{background:linear-gradient(135deg,#10b981,#34d399);border-color:transparent;transform:scale(1.05)}
.chk.s{width:28px;height:28px;font-size:13px}
.pcell{padding:3px 9px;border-radius:8px;font-size:12px;font-weight:650;border:1px solid var(--line);background:var(--panel2);color:var(--mut);white-space:nowrap}
.pcell.ok{background:#34d39922;color:var(--ok);border-color:#34d39955}.pcell.bad{background:#fb718522;color:var(--bad);border-color:#fb718555}.pcell:hover{filter:brightness(1.2)}

/* ---- laporan harian ---- */
.kr{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);margin-bottom:10px;animation:up .25s ease}
.kr .kt{display:flex;gap:10px;align-items:center;flex-wrap:nowrap}
.kr .kt input{font-weight:650}
.auto{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#22d3ee1f;color:var(--a2);flex:none;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px;color:var(--mut);transition:.15s}.chip:hover{color:var(--ink);border-color:var(--a1)}
.file{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.file button{width:20px;height:20px;border-radius:50%;color:var(--mut);display:grid;place-items:center;font-size:12px}.file button:hover{background:var(--bad);color:#fff}
.th{position:relative;width:64px;height:64px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;font-size:11px;text-align:center;padding:4px;word-break:break-all}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;font-size:12px;z-index:2}
.dock{position:sticky;bottom:14px;display:flex;gap:12px;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);box-shadow:var(--shadow);align-items:center;z-index:5}
.lock{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;background:#34d39918;border:1px solid #34d39944;color:var(--ok);margin-bottom:14px}
.sy{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.sy button{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--mut)}.sy button.on{background:#34d39922;border-color:#34d39966;color:var(--ok)}
.addchip{border-style:dashed!important}

/* ---- grafik & daftar ---- */
.sbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--panel2);gap:2px}.sbar i{display:block;height:100%}
.legend{display:flex;gap:16px;color:var(--mut);font-size:12.5px;margin-top:12px;flex-wrap:wrap}.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:4px;background:var(--c);margin-right:6px;vertical-align:-1px}
.al{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:14px;margin-bottom:8px;background:var(--panel2);font-size:13.5px;border-left:4px solid var(--c,var(--mut))}
.al.bad{--c:var(--bad)}.al.warn{--c:var(--warn)}.al.info{--c:var(--info)}.al.ok{--c:var(--ok)}
.al svg{color:var(--c);margin-top:2px}.al b{display:block}.al small{color:var(--mut)}
.feed{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.feed:last-child{border:0}.feed .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none;background:var(--c,var(--a1));box-shadow:0 0 10px var(--c,var(--a1))}
.lb{display:grid;grid-template-columns:26px 1fr 44px;gap:10px;align-items:center;padding:8px 0}
.heat{border-collapse:separate;border-spacing:3px}.heat td,.heat th{padding:0;text-align:center}.heat .nm{text-align:left;padding-right:12px;font-weight:600;font-size:12.5px;white-space:nowrap}
.cell{display:block;width:24px;height:24px;border-radius:7px;background:var(--panel2)}.cell.sent{background:linear-gradient(135deg,#10b981,#34d399);cursor:pointer}.cell.draft{background:var(--warn);cursor:pointer}.cell.none{background:#fb718566}.cell.today{outline:2px solid var(--a2)}
.empty{text-align:center;color:var(--mut);padding:34px 16px}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* ---- lapisan (laci, modal, toast) ---- */
.ov{position:fixed;inset:0;background:#02030a99;backdrop-filter:blur(4px);z-index:40;display:none}.ov.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--bg2);border-left:1px solid var(--line);z-index:41;padding:22px;overflow:auto;transform:translateX(105%);transition:.3s cubic-bezier(.2,.8,.2,1)}.drawer.on{transform:none}
.fld{margin-bottom:14px}.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px;font-weight:600}
.modal{position:fixed;left:50%;top:7vh;transform:translateX(-50%);width:min(780px,94%);max-height:86vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:22px;z-index:41;display:none;box-shadow:var(--shadow)}.modal.on{display:block;animation:up .25s}
.pal{top:14vh;width:min(560px,94%);padding:12px}.pal input{border:0;background:transparent;font-size:16px;padding:12px}
.pi{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;width:100%;text-align:left}.pi:hover,.pi.on{background:var(--panel2)}.pi small{color:var(--mut);margin-left:auto}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:var(--shadow);max-width:92vw;text-align:center}.toast.on{opacity:1;transform:translateX(-50%)}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:70;animation:fall 1.9s ease-in forwards;pointer-events:none}

<script>
/* Pembaruan otomatis: saat halaman dibuka, bila versi di server berbeda dari yang terakhir dimuat, muat ulang SEKALI (tanpa Ctrl+Shift+R). Hanya saat dibuka, supaya isian yang sedang diketik tidak hilang. */
(function () { try {
  const KEY = "ver:" + location.pathname, h = (t) => { let x = 5381; for (let i = 0; i < t.length; i++) x = ((x << 5) + x + t.charCodeAt(i)) | 0; return String(x); };
  fetch(location.pathname, { cache: "no-store" }).then((r) => (r.ok ? r.text() : null)).then((t) => {
    if (!t) return; const v = h(t), lama = localStorage.getItem(KEY); localStorage.setItem(KEY, v);
    if (lama && lama !== v) { const t0 = Number(sessionStorage.getItem("verReload") || 0); if (Date.now() - t0 > 30000) { sessionStorage.setItem("verReload", String(Date.now())); location.reload(); } }
  }).catch(() => {});
} catch (e) {} })();
/* ============ KONSTANTA ============ */
const PICS=[{n:'OPAL',a:'Area Pantura Barat',k:'area'},{n:'IZZAR',a:'Area Pantura Barat (Izzar)',k:'area'},{n:'HITA',a:'Area Kedu Raya',k:'area'},{n:'ADI',a:'Area ADI',k:'area'},{n:'PAK TOHAR',a:'Area Client Lama',k:'area'},{n:'ZAHRA',a:'Area Timur',k:'area'},{n:'MIDAN',a:'Area Kalimantan',k:'area'},{n:'DINI',a:'Area BPS & Swasta',k:'area'},{n:'IFA',a:'BPJS Kesehatan & TK',k:'ifa'},{n:'RIKI',a:'BPJS (rekap & progres)',k:'riki'},{n:'KARIN',a:'Laporan bulanan & absensi',k:'karin'},{n:'PAK BAYU',a:'Laporan harian',k:'umum'},{n:'LAILI',a:'Laporan harian',k:'umum'},{n:'NIKEN',a:'Laporan harian',k:'umum'},{n:'YAYA',a:'Laporan harian',k:'umum'},{n:'ELA',a:'Laporan harian',k:'umum'}];
const AREA=PICS.filter(p=>p.k==='area').map(p=>p.n);
const BASE=[['inv','Invoice + RAB'],['kwt','Kwitansi'],['faktur','Faktur Pajak']];
const PRESET=['Bukti TF gaji','Bukti TF BPJS','BA / BAP','BAST','BAPP','Slip gaji','Surat permohonan'];

const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const MONTHS=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10'];
const IC={alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',home:'<path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',wallet:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',plus:'<path d="M12 5v14M5 12h14"/>',out:'<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"/>',dl:'<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',check:'<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="m8 12 3 3 5-6"/>',inv:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24">${IC[n]}</svg>`;
/* ---- tampilan: nama enak dibaca, panduan singkat ---- */
const ACR=new Set(['PT','CV','UPPD','BPN','ATR','BPS','BKK','RSUD','DLH','DPU','DPRD','DP2KBP2PA','BBPMP','BBTIK','BPTIK','DPMPTSP','PSDA','BPKAD','SMA','SMK','MAN','MTS','MTSN','PN','POLRES','POLDA','POLRESTA','BPOM','BGTK','BAPENDA','BPBD','TK','KES','WA','RAB','BAP','BAST','BAPP','LS','UP','II','III','IV','CS','RMP','HSG','DKV','KIK','AIM','STL','SAT','DC','SD','TW','BPR','BPAFK','KPJ','NPP','JKK','ESDM','RS','UPT','UPTD','BLUD','BBPOM','KPPN','PDAM','PLN','PUPR','BWS','BBWS','BP','TIK','PPN','PPH','KES','RO','DPRD','LAPAS','RUTAN','BNN','OJK','KPU','TNI','POLRI']);
function nice(s){s=String(s==null?'':s);if(!s||s!==s.toUpperCase())return s;
 return s.replace(/[A-ZÀ-Ý0-9\/&.\-+]+/g,w=>{const core=w.replace(/[^A-Z0-9]/g,'');if(!core)return w;if(ACR.has(core)||/\d/.test(core)||(core.length<=4&&!/[AEIOU]/.test(core)))return w;return w[0]+w.slice(1).toLowerCase()})}
const guideOff=()=>{try{return JSON.parse(localStorage.getItem('ws_guide')||'{}')}catch(e){return{}}};
function guide(key,steps){if(guideOff()[key])return '';
 return `<div class="guide"><button class="x" data-act="gclose" data-k="${key}" title="Sembunyikan panduan">${ic('x')}</button><b>${ic('bolt')} Cara memakainya</b><ol>${steps.map((s,i)=>`<li><i>${i+1}</i><span>${s}</span></li>`).join('')}</ol></div>`}

/* ============ UTIL ============ */
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=iso(new Date()),THISM=TODAY.slice(0,7),CURM=MONTHS.includes(THISM)?THISM:MONTHS[MONTHS.length-1];
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=s=>{const d=parse(s);return `${HARI[d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`};
const fmtS=s=>{const d=parse(s);return `${d.getDate()} ${BLN[d.getMonth()].slice(0,3)}`};
const mName=m=>BLN[+m.slice(5)-1],mLab=m=>`${mName(m)} ${m.slice(0,4)}`,mShort=m=>mName(m).slice(0,3);
const wd=s=>{const w=parse(s).getDay();return w>0&&w<6};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const rpS=n=>n>=1e9?(n/1e9).toFixed(2).replace('.',',')+' M':n>=1e6?Math.round(n/1e6).toLocaleString('id-ID')+' jt':rp(n);
const uid=()=>Math.random().toString(36).slice(2,9);
const pic=n=>PICS.find(p=>p.n===n);
const norm=s=>String(s||'').toUpperCase().replace(/\(.*?\)/g,'').replace(/[^A-Z0-9]/g,'');
const slug=l=>'x_'+l.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const monthDays=m=>{const[y,mm]=m.split('-').map(Number);const o=[];for(let d=1;d<=new Date(y,mm,0).getDate();d++)o.push(`${y}-${pad(mm)}-${pad(d)}`);return o.filter(wd)};
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
function confetti(){const c=['#6d5bff','#22d3ee','#34d399','#fbbf24','#fb7185'];for(let i=0;i<46;i++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];e.style.animationDelay=Math.random()*.4+'s';e.style.animationDuration=1.5+Math.random()+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}}

/* ============ DATA (dari sheet asli Jan–Okt 2026) ============ */
let DB={clients:[],reports:{},bpjs:{},lapbul:{},exempt:[]};
const DINI_DOCS=['BAST','BAPP','BAP','Bukti TF gaji','Bukti TF BPJS'];
function deriveExtras(t){t=String(t||'').toUpperCase();const o=[],add=l=>o.push({k:slug(l),l});
 if(/\bBAP\b|\bBA\b|BERITA ACARA/.test(t))add('BA / BAP');if(/BAST/.test(t))add('BAST');if(/BAPP/.test(t))add('BAPP');
 if(/BPJS/.test(t))add('Bukti TF BPJS');if(/GAJI/.test(t))add('Bukti TF gaji');return o}
const getR=(p,d)=>DB.reports[`${p}|${d}`],stateOf=(p,d)=>getR(p,d)?.status||'none';
const hasLog=p=>Object.keys(DB.reports).some(k=>k.startsWith(p+'|'));
const SL={sent:'Sudah kirim',draft:'Draft',none:'Belum isi'};
const cl=id=>DB.clients.find(c=>c.id===id);
const inM=(p,m)=>DB.clients.filter(c=>c.owner===p&&c.ms[m]);
const stepsOf=c=>[...BASE.map(([k,l])=>({k,l})),...(c.extra||[]),{k:'kirim',l:'Dikirim ke client'}];
const flag=(c,k,m)=>k.startsWith('x_')?!!c.ms[m].chk[k]:!!c.ms[m][k];
const setFlag=(c,k,v,m)=>{const o=c.ms[m];if(k.startsWith('x_'))o.chk[k]=v;else o[k]=v;if(k==='kirim')o.tgl=v?fmtS(TODAY):''};
const done=(c,m)=>stepsOf(c).every(s=>flag(c,s.k,m));
const catOf=(c,m)=>{const v=c.pay[m];if(v==='LUNAS')return 'dibayar';if(v===0)return 'nihil';return c.ms[m].kirim?'ditagih':'belum'};
const prevDebt=(c,m)=>Object.entries(c.pay).filter(([k,v])=>k<m&&typeof v==='number').reduce((a,[,v])=>a+v,0);
function sums(L,m){const r={belum:0,ditagih:0,dibayar:0,tunggakan:0,nb:0,nt:0,nd:0};for(const c of L){const k=catOf(c,m),n=c.ms[m].nom;if(k==='belum'){r.belum+=n;r.nb++}else if(k==='ditagih'){r.ditagih+=n;r.nt++}else if(k==='dibayar'){r.dibayar+=n;r.nd++}r.tunggakan+=prevDebt(c,m)}return r}
const pctOf=(L,k,m)=>L.length?Math.round(100*L.filter(c=>flag(c,k,m)).length/L.length):0;
const CATL={belum:['Belum ditagih','belum'],ditagih:['Menunggu bayar','ditagih'],dibayar:['Lunas','dibayar'],nihil:['Belum ada tagihan','nihil']};

let STATUS_TXT='Memuat…';
let S={cat:'todo',lim:25,rm:'2026-09',km:'2026-10',rj:'semua',rs:'semua',kf:'semua',user:null,page:null,q:'',only:false,filt:'semua',bulan:CURM,lm:CURM,fpic:'OPAL',rf:{pic:'',from:'2026-01-01',to:TODAY}};
const DIR=()=>S.user==='DIREKTUR';

document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');

/* ============ CHART ============ */
function donut(parts,size,sw,center){const tot=parts.reduce((a,b)=>a+b.v,0)||1,r=(size-sw)/2,c=2*Math.PI*r;let off=0;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="${sw}"/>${parts.filter(p=>p.v).map(p=>{const l=c*p.v/tot,o=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="${sw}" stroke-dasharray="${Math.max(l-2,1)} ${c-l+2}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=l;return o}).join('')}<text x="50%" y="52%" text-anchor="middle" fill="var(--ink)" font-size="30" font-weight="800">${center}</text><text x="50%" y="68%" text-anchor="middle" fill="var(--mut)" font-size="11">sudah kirim</text></svg>`}

 const k=pic(S.user).k;return k==='area'?[['hari','home','Hari ini'],['inv','inv','Invoice'],['lap','doc','Laporan harian'],['bayar','wallet','Pembayaran']]:k==='riki'?[['riki','list','BPJS per lokasi'],['lap','doc','Laporan harian']]:k==='karin'?[['karin','check','Laporan bulanan & absensi'],['karinx','list','Pengecualian'],['lap','doc','Laporan harian']]:[['lap','doc','Rencana kerja harian']]}

 return `<div id="menuback"></div><aside class="side"><div class="logo"><i>RM</i><div><b>RAY Workspace</b><small>PT Ray Mitra Perkasa</small></div></div>

function vLap(){const p=S.user,rows=entriesOf((pp,d)=>pp===p&&(S.lm==='all'||d.startsWith(S.lm))&&d<TODAY),has=hasLog(p);

function thumbOf(file){return new Promise(res=>{if(!file.type.startsWith('image/'))return res({name:file.name,thumb:null});const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,160/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({name:file.name,thumb:c.toDataURL('image/jpeg',.6)})};im.onerror=()=>res({name:file.name,thumb:null});im.src=fr.result};fr.readAsDataURL(file)})}
function entriesOf(filter){const o=[];for(const[k,r]of Object.entries(DB.reports)){const[p,d]=k.split('|');if(!filter(p,d))continue;r.entries.forEach(e=>o.push({p,d,e,st:r.status}))}return o.sort((a,b)=>b.d.localeCompare(a.d)||a.p.localeCompare(b.p))}

  <div class="kbox"><label class="chkrow"><input type="checkbox" name="lap" ${r?.lap?'checked':''}> <b>Laporan bulanan</b> sudah selesai${r?.lapTgl?` <small class="sub">(${esc(r.lapTgl)})</small>`:''}</label>${fld('Keterangan laporan','lapKet',r?.lapKet,'mis. KURANG 2 FOTO')}</div>
  <div class="kbox"><label class="chkrow"><input type="checkbox" name="abs" ${r?.abs?'checked':''}> <b>Absensi</b> sudah selesai${r?.absTgl?` <small class="sub">(${esc(r.absTgl)})</small>`:''}</label>${fld('Keterangan absensi','absKet',r?.absKet,'DEMPUL / EPICOLLECT / SAT')}</div>
  ${fld('Catatan','cat',r?.cat,'catatan lain bila ada')}`}
 <p class="sub" style="font-size:12.5px;margin-bottom:14px">${id?'':(kind==='riki'?`Data baru ditambahkan ke ${mLab(m)} dengan semua centang kosong.`:`Client baru ditulis di baris paling bawah daftar sheet Anda (${mLab(m)}). Yang Anda centang masuk otomatis ke Laporan harian.`)}</p>
 <div class="row"><button class="btn" type="submit" style="flex:1">Simpan</button>${id?`<button class="btn red" type="button" data-act="ldel" data-k="${kind}" data-id="${id}" title="Hapus">Hapus</button>`:''}</div></form>`;
 $('#dr').classList.add('on');$('#ov').classList.add('on')}
document.addEventListener('submit',ev=>{const f=ev.target;if(f.id!=='lf')return;ev.preventDefault();const d=Object.fromEntries(new FormData(f)),kind=f.dataset.kind,id=f.dataset.id;
 if(kind==='riki'){const list=DB.bpjs[S.rm];if(!(d.tk||d.kes).trim())return toast('Isi nama lokasi');
  if(id)Object.assign(list.find(x=>x.id===id),{tk:d.tk.trim(),kes:d.kes.trim(),note:d.note});
  else{const nf={};RCOL.forEach(c=>nf[c[0]]=false);list.push({id:'b'+uid(),no:list.length+1,tk:d.tk.trim(),kes:d.kes.trim(),f:nf,nk:0,nt:0,note:d.note})}}
 else{const list=DB.lapbul[S.km];if(!d.name.trim())return toast('Isi nama client');
  let rec;const setW=(w,on)=>{if(!!rec[w]===on)return;const rp=myRep(false);if(rp&&rp.status==='sent'){const t=new Date();rec[w]=on;rec[w+'Tgl']=on?`${pad(t.getDate())}/${pad(t.getMonth()+1)}/${String(t.getFullYear()).slice(2)}`:''}else ktick(rec.id,w)};
  if(id){rec=list.find(x=>x.id===id);Object.assign(rec,{name:d.name.trim(),pic:d.pic,grup:d.grup,cat:d.cat,lapKet:d.lapKet||'',absKet:d.absKet||''})}
  else{rec={id:'k'+uid(),name:d.name.trim(),pic:d.pic,grup:d.grup,lap:false,lapTgl:'',lapKet:d.lapKet||'',abs:false,absTgl:'',absKet:d.absKet||'',cat:d.cat};list.push(rec)}
  setW('lap',!!d.lap);setW('abs',!!d.abs)}
 save();closeAll();render();toast(`${kind==='riki'?'Lokasi':'Client'} tersimpan`)});

/* --- event tambahan --- */
document.addEventListener('input',ev=>{const el=ev.target;
 if(el.dataset.rn!==undefined){const r=(DB.bpjs[S.rm]||[]).find(x=>x.id===el.dataset.rn);if(r){r.note=el.value;save()}}
 else if(el.dataset.kr!==undefined){const[id,f]=el.dataset.kr.split('|'),r=(DB.lapbul[S.km]||[]).find(x=>x.id===id);if(r){r[f]=el.value;save()}}});
document.addEventListener('change',ev=>{const el=ev.target,a=el.dataset.act;if(a==='rm'){S.rm=el.value;render()}else if(a==='km'){S.km=el.value;render()}});
Object.assign(ACT,{gclose(b){const o=guideOff();o[b.dataset.k]=1;localStorage.setItem('ws_guide',JSON.stringify(o));render()},cat(b){S.cat=b.dataset.v;S.lim=25;render()},more(){S.lim=(S.lim||25)+25;render()},lnew(b){lform(b.dataset.k,null)},ledit(b){lform(b.dataset.k,b.dataset.id)},ldel(b){if(!confirm('Hapus data ini dari bulan yang dipilih?'))return;const k=b.dataset.k,l=k==='riki'?DB.bpjs[S.rm]:DB.lapbul[S.km],i=l.findIndex(x=>x.id===b.dataset.id);if(i>=0)l.splice(i,1);save();closeAll();render();toast('Dihapus')},iplan(b){const r=myRep(true),n=new Date();r.entries.push({id:uid(),kegiatan:IFA_PLANS[+b.dataset.i],jam:`${pad(n.getHours())}:${pad(n.getMinutes())}`,items:[],ket:'',st:'proses',bukti:[]});save();render()},rk(b){rtick(b.dataset.id,b.dataset.f)},kt(b){ktick(b.dataset.id,b.dataset.w)},rj(b){S.rj=b.dataset.v;render()},rs(b){S.rs=b.dataset.v;render()},kf(b){S.kf=b.dataset.v;render()}});


/* ============ SAMBUNGAN KE SERVER (Worker n8nkontrol) ============ */
const API='https://n8nkontrol.sentraless.workers.dev';
let TOKEN='';try{TOKEN=localStorage.getItem('tok')||''}catch(e){}
let LOGIN_MSG='Memuat…',PUSAT=null,SYNC=null,AKUN=null,SNAP=null,VER=0,saveT=null,saving=false;
async function api(path,body){
 const r=await fetch(API+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+TOKEN,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(j.error||('Kode '+r.status));e.code=r.status;throw e}return j}
function setStatus(t,k){STATUS_TXT=t;const e=document.querySelector('.statpill');if(e){e.lastChild.textContent=t;e.className='statpill'+(k==='warn'?' demo':'')}}
const snapOf=D=>{const m=new Map();for(const c of D.clients||[])m.set('c|'+c.id,JSON.stringify(c));for(const[k,r]of Object.entries(D.reports||{}))m.set('r|'+k,JSON.stringify(r));
 for(const[mm,l]of Object.entries(D.bpjs||{}))for(const x of l)m.set(`b|${mm}|${x.id}`,JSON.stringify(x));for(const[mm,l]of Object.entries(D.lapbul||{}))for(const x of l)m.set(`k|${mm}|${x.id}`,JSON.stringify(x));return m};
const opOf=(p,v)=>p[0]==='c'?{t:'c',id:p[1],v}:p[0]==='r'?{t:'r',k:p.slice(1).join('|'),v}:p[0]==='b'?{t:'b',m:p[1],id:p[2],v}:{t:'k',m:p[1],id:p[2],v};
function collectOps(){const cur=snapOf(DB),ops=[];for(const[k,s]of cur)if(SNAP.get(k)!==s)ops.push(opOf(k.split('|'),JSON.parse(s)));for(const k of SNAP.keys())if(!cur.has(k))ops.push(opOf(k.split('|'),null));return{ops,cur}}
const save=()=>{if(!SNAP)return;setStatus('Menyimpan…','warn');clearTimeout(saveT);saveT=setTimeout(flush,600)};
async function flush(){
 if(saving){saveT=setTimeout(flush,400);return}
 const{ops,cur}=collectOps();if(!ops.length){setStatus('Tersimpan ✓');return}
 saving=true;
 try{for(let i=0;i<ops.length;i+=60){const r=await api('/api/lh/patch',{ops:ops.slice(i,i+60)});VER=r.v}SNAP=cur;setStatus('Tersimpan ✓')}
 catch(e){if(e.code===401){setStatus('Sesi habis — masuk ulang di Pusat Kontrol','warn');toast('Sesi habis. Masuk ulang di Pusat Kontrol.')}else{setStatus('Belum tersimpan — mencoba lagi…','warn');saveT=setTimeout(flush,5000)}}
 finally{saving=false}}
addEventListener('beforeunload',ev=>{if(SNAP&&collectOps().ops.length){ev.preventDefault();ev.returnValue=''}});
async function loadState(){
 const r=await api('/api/lh/state');DB={clients:[],reports:{},bpjs:{},lapbul:{},exempt:[],...r.state};VER=r.v;SNAP=snapOf(DB);
 RMONTHS=Object.keys(DB.bpjs).sort();KMONTHS=Object.keys(DB.lapbul).sort();
 if(RMONTHS.length&&!RMONTHS.includes(S.rm))S.rm=RMONTHS[RMONTHS.length-1];if(KMONTHS.length&&!KMONTHS.includes(S.km))S.km=KMONTHS[KMONTHS.length-1];
 if(S.user==='ADMIN'){try{PUSAT=await api('/api/lh/pusat')}catch(e){PUSAT=null}}}
async function boot(){
 if(!TOKEN){LOGIN_MSG='Anda belum masuk. Masuk dulu di Pusat Kontrol, lalu buka menu Laporan Harian Internal.';render();return}
 try{const me=await api('/api/lh/me');
  if(!me.pic){LOGIN_MSG='Akun Anda belum dihubungkan ke seorang PIC. Minta Admin mengaturnya di menu “Sinkron & akun”.';render();return}
  S.user=me.pic;S.me=me;await loadState();setStatus('Tersimpan ✓');
 }catch(e){S.user=null;LOGIN_MSG=e.code===401?'Sesi habis. Masuk ulang di Pusat Kontrol.':e.code===403?e.message:'Tidak bisa tersambung ke server. Periksa koneksi internet lalu muat ulang halaman.'}
 render();
 setInterval(async()=>{if(!S.user||saving||document.hidden)return;const a=document.activeElement;if(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName))return;
  try{const{ops}=collectOps();if(ops.length)return;const v=await api('/api/lh/version');if(v.v!==VER){await loadState();render()}}catch(e){}},20000)}

/* ---- halaman Admin: sinkron ke Google Sheets & akun ---- */
async function loadSync(){try{SYNC=await api('/api/lh/sync');AKUN=await api('/api/lh/akun')}catch(e){SYNC={error:e.message};AKUN={akun:[],pics:[]}}render()}
function vSync(){
 if(!SYNC){loadSync();return head('Sinkron & akun','Mengatur pengiriman ke Google Sheets dan hubungan akun ke PIC')+'<div class="card empty"><b>Memuat…</b></div>'}
 if(SYNC.error)return head('Sinkron & akun','')+`<div class="card empty"><b>Gagal memuat</b>${esc(SYNC.error)}<br><br><button class="btn" data-act="syncreload">Coba lagi</button></div>`;
 const ST=['ok','ditahan','menunggu','pending','gagal'],ps=['OPAL','IZZAR','HITA','ADI','PAK TOHAR','ZAHRA','MIDAN','DINI','IFA','RIKI','KARIN','PAK BAYU','LAILI','NIKEN','YAYA','ELA'];
 return head('Sinkron & akun','Mengatur pengiriman ke Google Sheets dan hubungan akun ke PIC',`<button class="btn ghost" data-act="syncreload">Muat ulang</button><button class="btn ghost" data-act="syncretry">Kirim ulang yang gagal</button>`)+
 `<div class="card" style="border-color:#fbbf2466"><div class="row" style="flex-wrap:nowrap"><span class="auto" style="background:#fbbf2422;color:var(--warn)">${ic('info')}</span><div class="hint" style="font-size:13.5px;color:var(--ink)"><b>Cara kerjanya:</b> saat saklar <b>mati</b>, perubahan PIC hanya tersimpan di website dan <b>ditahan</b> (belum menyentuh Google Sheets). Hidupkan satu per satu <b>setelah diuji di salinan sheet</b>. Di n8n, workflow juga punya mode “coba tulis” (<code>DRY_RUN</code>) yang harus dimatikan agar benar-benar menulis. ${SYNC.rahasiaTerisi?'':'<br><b style="color:var(--bad)">Rahasia sinkron belum terisi di server — kejadian belum bisa dikirim ke n8n.</b>'}</div></div></div>
 <div class="card scroll"><h2>Sinkron ke Google Sheets per orang</h2><table class="tbl"><thead><tr><th>PIC</th><th>Sinkron</th>${ST.map(s=>`<th style="text-align:right">${s}</th>`).join('')}</tr></thead><tbody>
 ${ps.map(p=>{const r=SYNC.ringkas[p]||{},on=!!SYNC.aktif[p];return `<tr><td><b>${p}</b></td><td><button class="btn ${on?'ok':'ghost'} sm" data-act="syncpic" data-p="${p}" data-on="${on?0:1}">${on?'✓ Hidup':'Mati'}</button></td>${ST.map(s=>`<td style="text-align:right">${r[s]||'—'}</td>`).join('')}</tr>`}).join('')}</tbody></table>
 <p class="hint" style="margin-top:10px"><b>ok</b> sudah terkirim ke n8n · <b>ditahan</b> sinkron mati · <b>menunggu</b> workflow n8n belum aktif · <b>pending</b> akan dicoba lagi · <b>gagal</b> 6× gagal.</p></div>
 <div class="card scroll"><h2>Akun website ↔ PIC</h2><p class="hint" style="margin:-6px 0 12px">Setiap akun yang punya menu “Laporan Harian Internal” harus dihubungkan ke satu PIC. Admin melihat semua.</p>
 <table class="tbl"><thead><tr><th>Email</th><th>Peran / menu</th><th>PIC</th></tr></thead><tbody>${(AKUN.akun||[]).filter(a=>a.role==='admin'||/lh/.test(a.menus)||a.pic).map(a=>`<tr><td><b>${esc(a.email)}</b></td><td>${a.role==='admin'?'Admin':esc(a.menus||'—')}</td><td><select data-act="akunpic" data-em="${esc(a.email)}" style="width:auto"><option value="">— belum —</option>${(AKUN.pics||[]).map(p=>`<option ${a.pic===p?'selected':''}>${p}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=3 class="empty">Belum ada akun dengan menu Laporan Harian Internal. Tambahkan menu itu pada akun di menu Pengaturan situs, lalu atur PIC-nya di sini.</td></tr>'}</tbody></table></div>
 <div class="card"><h2>Pindahkan client Izzar</h2><p class="hint" style="margin:-6px 0 12px">Client di daftar OPAL yang PIC admin-nya IZZAR (bulan terbaru) dipindah ke daftar IZZAR. Aman dijalankan berulang. Google Sheet tidak diubah.</p><button class="btn ok sm" data-act="pindahizzar">Pindahkan sekarang</button></div>
 <div class="card scroll"><h2>Kejadian terakhir</h2><table class="tbl"><thead><tr><th>Waktu</th><th>PIC</th><th>Jenis</th><th>Tentang</th><th>Status</th></tr></thead><tbody>${(SYNC.terakhir||[]).map(o=>`<tr><td style="white-space:nowrap">${esc(o.ts.slice(5,16).replace('T',' '))}</td><td>${esc(o.pic)}</td><td>${esc(o.type||'')}</td><td>${esc(nice(o.ringkas||''))}</td><td><span class="pill ${o.status==='ok'?'ok':o.status==='gagal'?'bad':o.status==='ditahan'?'mut':'warn'}">${o.status}</span>${o.error?` <small class="sub">${esc(o.error)}</small>`:''}</td></tr>`).join('')||'<tr><td colspan=5 class="empty">Belum ada kejadian.</td></tr>'}</tbody></table></div>`}
function pusatCard(){
 const P=PUSAT&&PUSAT.area?PUSAT:null;
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Ringkasan langsung dari Google Sheets</h2><button class="btn ghost sm" data-act="pusatrun">${ic('bolt')} Perbarui sekarang</button></div>
 ${P?`<p class="sub" style="margin:4px 0 12px;font-size:13px">Dibaca workflow pusat (n8n) · ${esc(String(P.bulan||''))} · diperbarui ${esc(new Date(P.simpan||P.diperbarui||Date.now()).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}))} WIB</p>
 <div class="scroll"><table class="tbl"><thead><tr><th>PIC</th><th>Client</th><th style="text-align:right">Belum ditagih</th><th style="text-align:right">Menunggu bayar</th><th style="text-align:right">Lunas</th><th style="text-align:right">Tunggakan lalu</th><th>Terkirim</th></tr></thead><tbody>${P.area.map(a=>`<tr><td><b>${esc(a.pic)}</b></td><td>${a.n}</td><td style="text-align:right;color:var(--bad)">${a.belum?rpS(a.belum):'—'}</td><td style="text-align:right;color:var(--info)">${a.ditagih?rpS(a.ditagih):'—'}</td><td style="text-align:right;color:var(--ok)">${a.dibayar?rpS(a.dibayar):'—'}</td><td style="text-align:right">${a.tunggakan?rpS(a.tunggakan):'—'}</td><td>${a.n?Math.round(100*a.kirim/a.n):0}%</td></tr>`).join('')}</tbody></table></div>
 ${(P.peringatan||[]).length?`<div style="margin-top:12px">${P.peringatan.map(x=>`<div class="al ${x.tingkat==='MERAH'?'bad':x.tingkat==='KUNING'?'warn':'info'}">${ic('alert')}<div><b>${esc(x.pesan)}</b></div></div>`).join('')}</div>`:''}`
 :`<p class="sub" style="margin-top:6px">Belum ada data dari workflow pusat. Tekan “Perbarui sekarang” (workflow <b>RAYMP LH — PUSAT DASHBOARD</b> di n8n harus aktif).</p>`}</div>`}
Object.assign(ACT,{
 syncreload(){SYNC=null;AKUN=null;render()},
 async syncpic(b){try{await api('/api/lh/sync/config',{pic:b.dataset.p,on:b.dataset.on==='1'});toast(b.dataset.on==='1'?`Sinkron ${b.dataset.p} dihidupkan`:`Sinkron ${b.dataset.p} dimatikan`);await loadSync()}catch(e){toast(e.message)}},
 async pindahizzar(){if(!confirm('Pindahkan client Opal ber-PIC IZZAR ke daftar IZZAR?'))return;try{const r=await api('/api/lh/pindah-izzar',{});toast(r.dipindah?r.dipindah+' client dipindah ke IZZAR':'Tidak ada yang perlu dipindah');if(r.dipindah){await loadState();render()}}catch(e){toast(e.message)}},
 async syncretry(){try{const r=await api('/api/lh/sync/retry',{});toast(`${r.n||0} kejadian dikirim ulang`);setTimeout(loadSync,1500)}catch(e){toast(e.message)}},
 async pusatrun(){toast('Meminta n8n membaca semua sheet…');try{const r=await api('/api/lh/pusat/perbarui',{});toast(r.ok?'Selesai. Memuat hasil…':'n8n menjawab kode '+r.status);setTimeout(async()=>{try{PUSAT=await api('/api/lh/pusat')}catch(e){}render()},1500)}catch(e){toast(e.message)}}});
document.addEventListener('change',async ev=>{const el=ev.target;if(el.dataset.act==='akunpic'){try{await api('/api/lh/akun',{email:el.dataset.em,pic:el.value});toast('Tersimpan');AKUN=null;await loadSync()}catch(e){toast(e.message)}}});
boot();
